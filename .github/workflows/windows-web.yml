name: SlimeVR Windows Web Installer

on: [ push, pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: windows-2022

    env:
      WINDOWS_WEB_DIR: ${{ github.workspace }}/windows/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download assets
        run: |
          New-Item -ItemType Directory -Force "${{ env.WINDOWS_WEB_DIR }}\assets"
          Invoke-WebRequest "https://github.com/SlimeVR/SlimeVR-Server/releases/latest/download/SlimeVR-win64.zip" `
            -OutFile "${{ env.WINDOWS_WEB_DIR }}\assets\SlimeVR-win64.zip"
          Invoke-WebRequest "https://github.com/SlimeVR/SlimeVR-OpenVR-Driver/releases/latest/download/slimevr-openvr-driver-win64.zip" `
            -OutFile "${{ env.WINDOWS_WEB_DIR }}\assets\slimevr-openvr-driver-win64.zip"
          Invoke-WebRequest "https://github.com/SlimeVR/SlimeVR-Feeder-App/releases/latest/download/SlimeVR-Feeder-App-win64.zip" `
            -OutFile "${{ env.WINDOWS_WEB_DIR }}\assets\SlimeVR-Feeder-App-win64.zip"

      - name: Create NSIS installer
        uses: joncloud/makensis-action@v5.0
        with:
          script-file: ${{ env.WINDOWS_WEB_DIR }}/slimevr_web_installer.nsi

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: "slimevr_web_installer"
          path: ${{ env.WINDOWS_WEB_DIR }}/slimevr_web_installer.exe

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: "${{ env.WINDOWS_WEB_DIR }}/slimevr_web_installer.exe"
